<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Beat the Word</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Beat the Word</h1>

<div class="panel">

  <!-- INFO -->
  <div class="info">
    <span>Nivel: <b id="nivel">1</b></span>
    <span>Tiempo: <b id="tiempo">0</b>s</span>
    <span>Estado: <b id="estado">En espera</b></span>
  </div>

  <!-- CONFIG -->
  <div class="config">
    <label>
      Secuencia:
      <select id="selectorSecuencia">
        <option value="casa_cama">Casa / Cama</option>
        <option value="fruta">Manzana / Pera</option>
        <option value="navidad">Santa / Rudolf</option>
      </select>
    </label>

    <label>
      Nivel inicial:
      <select id="nivelInicial">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>

    <button id="toggleMusica">Música ON</button>
  </div>

  <!-- BOTONES -->
  <div class="controls">
    <button id="start">Empezar</button>
    <button id="stop">Detener</button>
  </div>

</div>

<!-- MENSAJE -->
<div id="mensaje">Pulsa "Empezar"</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- AUDIO -->
<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
